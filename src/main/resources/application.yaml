server:
  port: 8082
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500

spring:
  application:
    name: resihub
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/resihub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 990829
    hikari:
      maximum-pool-size: 60
      minimum-idle: 20
      connection-timeout: 10000
      pool-name: resihub-pool
  redis:
    host: 127.0.0.1
    port: 6380
    database: 1
    lettuce:
      pool:
        max-active: 64
        max-idle: 64
        min-idle: 8
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  type-aliases-package: com.resihub.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: warn
    com.resihub: info
  pattern:
    dateformat: HH:mm:ss.SSS
