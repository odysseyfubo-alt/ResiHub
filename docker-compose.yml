# =====================================================================
# ResiHub 一键部署：MySQL 8 + Redis 7 + 应用（前端由应用自己托管）
#
#   docker compose up -d --build      # 首次构建并启动
#   docker compose logs -f app        # 看应用日志
#   docker compose down               # 停止（保留数据）
#   docker compose down -v            # 停止并清空数据（下次启动会重新跑 init.sql）
#
# 默认不对外暴露 MySQL/Redis 端口，避免和本机已有的 3306 / 6380 冲突；
# 需要本地客户端连进去时，把下面注释的 ports 打开即可。
# =====================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: resihub-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "990829"
      MYSQL_DATABASE: resihub
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动建表 + 灌种子数据
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # ports:
    #   - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p990829"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: resihub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # ports:
    #   - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: resihub:1.0.0
    container_name: resihub-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 容器网络里用服务名互相访问
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/resihub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "990829"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "0"
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"

volumes:
  mysql-data:
  redis-data:
